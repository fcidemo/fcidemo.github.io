<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCI Demo Data Logging</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --text-1:      #0b0b0b;
    --text-2:      #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --axis:        #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --hover:       rgba(11,11,11,0.04);
    --fresh:       rgba(27,175,122,0.18);
    --bad:         #d03b3b;
    --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;  --s4: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface-1: #1a1a19;
      --text-1:    #ffffff;
      --text-2:    #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --axis:      #383835;
      --border:    rgba(255,255,255,0.10);
      --hover:     rgba(255,255,255,0.05);
      --fresh:     rgba(25,158,112,0.28);
      --bad:       #f06a6a;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #898781;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface-1: #1a1a19;
    --text-1:    #ffffff;
    --text-2:    #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --border:    rgba(255,255,255,0.10);
    --hover:     rgba(255,255,255,0.05);
    --fresh:     rgba(25,158,112,0.28);
    --bad:       #f06a6a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #898781;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* beats display:flex etc. on classes */
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-1);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 16px 64px; }

  header { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 21px; margin: 0 6px 0 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); font-size: 13px; }
  .spacer { flex: 1 1 auto; }
  button, select, input {
    font: inherit; font-size: 13px; color: var(--text-1);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px;
  }
  button, select { cursor: pointer; }
  button:hover, select:hover { background: var(--hover); }
  input[type="search"] { min-width: 0; width: 220px; max-width: 100%; }

  .live { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--s3); flex: none; }
  .live.checking i { animation: pulse .9s ease-in-out infinite; }
  .live.paused i { background: var(--muted); }
  .live.error i { background: var(--bad); }
  .live.error { color: var(--bad); }
  @keyframes pulse { 50% { opacity: .25; } }
  .group { display: inline-flex; gap: 6px; align-items: center; }

  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 20px 0; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; }
  .tile .k { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-size: 26px; margin-top: 3px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .u { font-size: 14px; color: var(--text-2); margin-left: 2px; }
  .tile .n { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .tile.new { animation: fresh 4s ease-out; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
  .card .cap { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
  .cardhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; margin-bottom: 2px; }

  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters label { font-size: 12px; color: var(--text-2); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tick { font-size: 11px; fill: var(--muted); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axisline { stroke: var(--axis); stroke-width: 1; }
  .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface-1); stroke-width: 2; cursor: pointer; }
  .dot:not(:hover) { r: 4; }
  .dot.new { stroke: var(--text-1); }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; line-height: 1.45; color: var(--text-1);
    box-shadow: 0 6px 20px rgba(0,0,0,.14); z-index: 20; max-width: 250px;
  }
  #tip b { font-weight: 600; }
  #tip .m { color: var(--text-2); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600;
       cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--text-1); }
  th .arr { display: inline-block; width: 1em; }
  th.r, td.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.rec { cursor: pointer; }
  tr.rec:hover { background: var(--hover); }
  tr.rec.new td, tr.rec.hl td { animation: fresh 4s ease-out; }
  @keyframes fresh { from { background: var(--fresh); } to { background: transparent; } }
  tr.raw td { background: var(--page); padding: 0; border-bottom: 1px solid var(--border); }
  tr.raw pre { margin: 0; padding: 10px 12px; font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: var(--text-2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  td.data { font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--text-1);
            max-width: 460px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.data .c { color: var(--muted); }
  tr.raw .lbl { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
                padding: 10px 12px 0; }

  .empty { text-align: center; padding: 48px 16px; color: var(--text-2); }
  .empty .small { font-size: 12px; color: var(--muted); }
  .foot { font-size: 12px; color: var(--muted); margin-top: 26px; }

  .devbar { display: flex; gap: 12px; align-items: center; justify-content: space-between;
            flex-wrap: wrap; margin: 16px 0 0; }
  .devbar .k { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .devbar .line { font-size: 13px; color: var(--text-2); }
  .devbar .line b { color: var(--text-1); font-weight: 600; }
  .devbar a { color: var(--s1); }
  .devbar .warn { color: var(--bad); }
  button.primary { background: var(--s1); color: #fff; border-color: transparent; padding: 8px 14px; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); background: var(--s1); }
  button.primary:disabled { background: var(--surface-1); color: var(--muted); border-color: var(--border);
                            cursor: default; filter: none; font-weight: 400; }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 16px); opacity: 0;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30;
    background: var(--text-1); color: var(--page); border-radius: 999px; padding: 8px 16px; font-size: 13px;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    input[type="search"] { width: 100%; }
    .cardhead { align-items: stretch; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>FCI DEMO DATA LOGGING</h1>
    <span class="spacer"></span>
    <span class="group">
      <button id="live" class="live checking" title="Click to pause or resume automatic updates"><i></i><span>Connecting&hellip;</span></button>
      <select id="every" title="How often to check for new readings"></select>
      <button id="now" title="Check for new readings now" aria-label="Check now">&#x21bb;</button>
    </span>
    <button id="theme" title="Toggle light / dark">Theme</button>
    <button id="csv">Download CSV</button>
  </header>
  <div class="sub" id="meta"></div>

  <!-- shown only when this page is served by the logger itself -->
  <div class="card devbar" id="dev" hidden>
    <div>
      <div class="k">This logger</div>
      <div class="line" id="devline1"></div>
      <div class="line" id="devline2"></div>
    </div>
    <div class="group">
      <button id="redetect" title="Forget the baud rate and format, and learn them again from the next slip">Re-detect line</button>
      <button class="primary" id="pushbtn" disabled>Push to GitHub now</button>
    </div>
  </div>

  <div id="app"><div class="empty">Connecting&hellip;</div></div>

  <p class="foot">
    This page updates by itself. Raw slip bytes are stored verbatim with every
    record, so a parser change can be replayed over the history without loss.
  </p>
</div>

<div id="tip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ---------------------------------------------------------------------------
// Data source: database.json beside this page (override with ?src=)
// ---------------------------------------------------------------------------
const QS = new URLSearchParams(location.search);
const DATA_URL = QS.get('src') || './database.json';
if (QS.get('theme') === 'dark' || QS.get('theme') === 'light')
  document.documentElement.dataset.theme = QS.get('theme');

const TZ = 'Asia/Kolkata';   // show depot time (IST) whatever the viewer's timezone
const INTERVALS = [[15, 'every 15 s'], [30, 'every 30 s'], [60, 'every 1 min'], [300, 'every 5 min']];

// The first three categorical slots are the all-pairs-validated set; anything
// past the top three commodities folds into a muted "Other".
const SLOTS = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
const OTHER = 'var(--s4)';

// per-viewer preferences only; the page works the same without storage
const pref = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let refreshSec = +pref.get('refreshSec', 30);
if (!INTERVALS.some(i => i[0] === refreshSec)) refreshSec = 30;
let live = pref.get('live', '1') === '1';

let DB = null, ROWS = [], COLORS = new Map();
let filters = { commodity: 'all', range: 'all' }, query = '', sortBy = { key: 'seq', dir: -1 };
let sig = null, seen = null, fresh = new Set(), openRaw = new Set(), built = false;
let timer = null, lastCheck = 0, status = 'checking', errMsg = '';

// --- load (silent after the first time) -----------------------------------
async function load() {
  clearTimeout(timer);
  setStatus('checking');
  let db;
  try {
    const r = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    db = await r.json();
    if (!db || typeof db !== 'object') throw new Error('unexpected file contents');
  } catch (e) {
    lastCheck = Date.now();
    setStatus('error', e.message);
    if (!DB) showWaiting(e.message);
    schedule();
    return;
  }
  lastCheck = Date.now();

  let rows;
  if (Array.isArray(db.months)) {                     // the public site: records live in the archive
    ARCHIVE = true;
    const msig = [db.archived_up_to_seq, db.months.join(','), historyAll].join('|');
    if (msig !== archiveSig) {
      try { rows = await loadArchive(db); archiveSig = msig; }
      catch (e) { rows = ROWS.slice(); setStatus('error', e.message); }
    } else rows = ROWS.slice();
  } else {                                            // the logger's own page, or an older database.json
    ARCHIVE = false;
    rows = (Array.isArray(db.records) ? db.records : []).slice();
  }
  rows.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  const s = [db.total_readings, rows.length, rows.length ? rows[rows.length - 1].seq : ''].join('|');
  DB = db;
  paintMeta();
  if (s !== sig) {                            // only touch the page when the data changed
    fresh = new Set();
    if (seen) {
      for (const r of rows) if (!seen.has(r.seq)) fresh.add(r.seq);
      if (fresh.size) toast(fresh.size === 1 ? '1 new record' : fresh.size + ' new records');
    }
    seen = new Set(rows.map(r => r.seq));
    sig = s; ROWS = rows;
    assignColors();
    render();
    if (fresh.size) setTimeout(() => fresh.clear(), 5000);
  }
  setStatus('ok');
  schedule();
}

// --- the permanent archive ----------------------------------------------------
// database.json lists the months; each month's index.json lists its files;
// each file holds a batch of records and never changes. The recent view loads
// the newest ~RECENT records; "Load full history" loads everything.
const RECENT = 500;
let ARCHIVE = false, historyAll = false, archiveSig = null;
const ARCH = new Map(), LOADED = new Set();
let newestLoadedSeq = 0;

async function getJson(url, bust) {
  const r = await fetch(url + (bust ? '?t=' + Date.now() : ''), { cache: bust ? 'no-store' : 'default' });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
  return r.json();
}

async function loadArchive(db) {
  const base = './' + (db.archive || '');
  const months = [...db.months].sort().reverse();                 // newest month first
  for (const m of months) {
    let idx;
    try { idx = await getJson(base + m + '/index.json', true); } catch { continue; }
    const files = (idx.files || []).slice().sort().reverse();     // newest file first
    for (const f of files) {
      const path = base + m + '/' + f;
      if (LOADED.has(path)) continue;
      const first = +((f.match(/_(\d+)-(\d+)\.json$/) || [])[1] || 0);
      const isNew = first > newestLoadedSeq;                      // new since the last check: always load
      if (!historyAll && !isNew && ARCH.size >= RECENT) continue;
      const b = await getJson(path, false);                       // archive files never change: cacheable
      for (const r of b.records || []) ARCH.set(r.seq, r);
      LOADED.add(path);
    }
    if (!historyAll && ARCH.size >= RECENT) break;
  }
  for (const k of ARCH.keys()) if (k > newestLoadedSeq) newestLoadedSeq = k;
  return [...ARCH.values()];
}

function schedule() {
  clearTimeout(timer);
  if (live && !document.hidden) timer = setTimeout(load, refreshSec * 1000);
}

function assignColors() {
  const counts = new Map();
  for (const r of ROWS) counts.set(commodityOf(r), (counts.get(commodityOf(r)) || 0) + 1);
  const ranked = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  COLORS = new Map();
  ranked.forEach((name, i) => COLORS.set(name, i < 3 ? SLOTS[i] : OTHER));
}

// --- live status pill ------------------------------------------------------
function setStatus(s, msg) { status = s; errMsg = msg || ''; paintPill(); }

function paintPill() {
  const el = document.getElementById('live');
  const ago = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + ' s ago' : Math.round(s / 60) + ' min ago'; };
  let cls = status, txt;
  if (!live)                    { cls = 'paused'; txt = 'Paused'; }
  else if (status === 'checking') txt = 'Checking…';
  else if (status === 'error')    txt = 'Offline · retrying';
  else                            txt = 'Live · checked ' + ago(Date.now() - lastCheck);
  el.className = 'live ' + cls;
  el.lastChild.textContent = txt;
  el.title = (live ? 'Updating automatically. Click to pause.' : 'Paused. Click to resume.') +
             (errMsg ? '\nLast error: ' + errMsg : '');
}

// --- helpers ---------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const commodityOf = r => (r.commodity && String(r.commodity).trim()) || 'Unlabelled';
const colorOf = r => COLORS.get(commodityOf(r)) || OTHER;
const isNum = v => v != null && v !== '' && !isNaN(v);

function tsOf(r) {
  if (r.device_ts) { const d = new Date(r.device_ts); if (!isNaN(d)) return d; }
  return null;
}
function fmtTime(d) {
  return d ? d.toLocaleString(undefined, { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '--';
}
function num(v, dp = 1) { return isNum(v) ? Number(v).toFixed(dp) : '--'; }

function rawBytes(r) {
  try { return r.raw_b64 ? atob(r.raw_b64) : ''; } catch { return ''; }
}

// --- ESC/POS: keep the data, drop the printer commands ---------------------
// A meter that drives a thermal printer mixes printer commands (ESC @ reset,
// ESC ! bold, ESC a centre, GS V cut, bitmaps...) into the slip. Their
// parameter bytes can look like text, so this walks the bytes the way a
// printer does and drops each command together with its parameters.
// Same rules as escposToText() in firmware/moisture_logger/parser.h.
const ESC_ARGS = { '@': 0, '!': 1, 'a': 1, 'd': 1, 'e': 1, 'J': 1, 'K': 1, 'E': 1, 'G': 1, '-': 1, '2': 0, '3': 1,
  ' ': 1, 't': 1, 'R': 1, '{': 1, 'V': 1, 'B': 1, '%': 1, '?': 1, 'M': 1, 'U': 1, 'v': 1, 'u': 1, '9': 1,
  '=': 1, 'r': 1, 'T': 1, 'S': 0, 'L': 0, 'i': 0, 'm': 0, 'p': 3, '7': 3, '8': 2, '$': 2, '\\': 2, 'c': 2,
  'W': 8, '\x0e': 1, '\x14': 1 };
const GS_ARGS = { '!': 1, 'B': 1, 'H': 1, 'h': 1, 'w': 1, 'x': 1, 'f': 1, 'a': 1, 'r': 1, 'I': 1, 'T': 1, 'E': 1,
  'b': 1, '/': 1, 'L': 2, 'W': 2, 'P': 2, '^': 3, ':': 0, '\x0c': 0 };
const FS_ARGS = { '&': 0, '.': 0, '!': 1, '-': 1, 'W': 1, 'C': 1, 't': 1, 'S': 2, 'p': 2, 'd': 0, 's': 0 };
const DC2_ARGS = { '#': 1, 'T': 0, 'E': 0, 'm': 3 };
const CP437 = { 0xF8: '\u00b0', 0xF1: '\u00b1', 0xE6: '\u00b5', 0xFD: '\u00b2' };

function escpos(bin) {
  const n = bin.length, b = k => (k < n ? bin.charCodeAt(k) : 0);
  let out = '', i = 0, cmds = 0, image = 0;
  const skip = k => { if (k > 0) { image += Math.min(k, n - i); i = Math.min(n, i + k); } };
  while (i < n) {
    const c = b(i);
    if ((c === 0x1B || c === 0x1D || c === 0x1C || c === 0x12) && i + 1 < n) {
      const x = String.fromCharCode(b(i + 1));
      i += 2; cmds++;
      if (c === 0x1B) {                                   // ESC
        if (x in ESC_ARGS) i += ESC_ARGS[x];
        else if (x === 'D') { while (i < n && b(i) !== 0) i++; i++; }                 // tab stops, NUL-terminated
        else if (x === '*') { const m = b(i), k = b(i + 1) + 256 * b(i + 2); i += 3; skip(k * (m >= 32 ? 3 : 1)); }
        else if (x === '&') {                                                           // user-defined characters
          const y = b(i), c1 = b(i + 1), c2 = b(i + 2); i += 3;
          for (let ch = c1; ch <= c2 && i < n; ch++) { const w = b(i); i++; skip(y * w); }
        }
      } else if (c === 0x1D) {                            // GS
        if (x in GS_ARGS) i += GS_ARGS[x];
        else if (x === 'V') { const m = b(i); i += (m === 65 || m === 66) ? 2 : 1; }   // cut
        else if (x === 'k') {                                                           // barcode
          const m = b(i); i++;
          if (m <= 6) { const s0 = i; while (i < n && b(i) !== 0) i++; i++; image += i - s0; }
          else { const k = b(i); i++; skip(k); }
        }
        else if (x === 'v') { const k = (b(i + 2) + 256 * b(i + 3)) * (b(i + 4) + 256 * b(i + 5)); i += 6; skip(k); }  // raster image
        else if (x === '*') { const k = b(i) * b(i + 1) * 8; i += 2; skip(k); }
        else if (x === '(') { const k = b(i + 1) + 256 * b(i + 2); i += 3; skip(k); }
      } else if (c === 0x1C) {                            // FS
        if (x in FS_ARGS) i += FS_ARGS[x];
        else if (x === 'q') {                                                           // NV images
          const cnt = b(i); i++;
          for (let k = 0; k < cnt && i < n; k++) { const sz = (b(i) + 256 * b(i + 1)) * (b(i + 2) + 256 * b(i + 3)) * 8; i += 4; skip(sz); }
        }
      } else {                                            // DC2
        if (x in DC2_ARGS) i += DC2_ARGS[x];
        else if (x === '*') { const k = b(i) * b(i + 1); i += 2; skip(k); }
        else if (x === 'V' || x === 'v') { const k = (b(i) + 256 * b(i + 1)) * 48; i += 2; skip(k); }
      }
      continue;
    }
    if (c === 0x10 && (b(i + 1) === 4 || b(i + 1) === 5)) { i += 3; cmds++; continue; }   // DLE EOT/ENQ n
    if (c === 0x10 && b(i + 1) === 0x14) { i += 5; cmds++; continue; }                      // DLE DC4 n m t
    i++;
    if (c === 10 || c === 12) out += '\n';
    else if (c === 9) out += '\t';
    else if (c >= 32 && c < 127) out += String.fromCharCode(c);
    else if (c >= 128) out += CP437[c] || '\u00b7';
    // other control bytes (CR, NUL, BEL...) carry no data
  }
  out = out.split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '');
  return { text: out, cmds, image };
}

function cleanText(r) { return escpos(rawBytes(r)).text; }

// one line for the table: the data with printer commands removed. Data that
// isn't printer output at all (binary) shows byte by byte, <XX> for non-text.
function previewHtml(r) {
  const bin = rawBytes(r);
  if (!bin) return '<span class="c">(no bytes)</span>';
  const e = escpos(bin);
  let out = '';
  if (/[!-~]/.test(e.text)) {           // real text in it (not just stray bytes)
    out = e.text.split('\n').filter(l => l.trim()).map(l => esc(l.trim().replace(/\s{2,}/g, ' ')))
      .join('<span class="c"> \u23ce </span>');
    if (e.image) out = '<span class="c">[image] </span>' + out;
  } else if (e.cmds) {
    out = '<span class="c">' + (e.image ? '(printed as an image - no text)' : '(printer commands only, no text)') + '</span>';
  } else {
    let n = 0;
    for (let i = 0; i < bin.length && n < 160; i++) {
      const c = bin.charCodeAt(i);
      if (c === 13) continue;
      if (c === 10) { out += '<span class="c">\u23ce </span>'; n += 2; }
      else if (c >= 32 && c < 127) { out += esc(bin[i]); n++; }
      else { out += '<span class="c">&lt;' + c.toString(16).toUpperCase().padStart(2, '0') + '&gt;</span>'; n += 4; }
    }
  }
  if (r.continues) out = '<span class="c">[part, continues in the next record] </span>' + out;
  return out;
}

function detailHtml(r) {
  const e = escpos(rawBytes(r));
  const note = e.cmds ? ' (' + e.cmds + ' printer command' + (e.cmds === 1 ? '' : 's') + ' removed' +
                        (e.image ? ', ' + e.image + ' bytes of image/barcode skipped' : '') + ')' : '';
  return '<div class="lbl">Data' + note + '</div><pre>' + esc(e.text || '(no text)') + '</pre>' +
         '<div class="lbl">Exactly as received (hex)</div><pre>' + esc(hexDump(r)) + '</pre>';
}

function hexDump(r) {
  const bin = rawBytes(r);
  let out = '';
  for (let i = 0; i < bin.length; i += 16) {
    let hex = '', asc = '';
    for (let j = 0; j < 16; j++) {
      if (i + j < bin.length) {
        const c = bin.charCodeAt(i + j);
        hex += c.toString(16).toUpperCase().padStart(2, '0') + ' ';
        asc += c >= 32 && c < 127 ? bin[i + j] : '.';
      } else hex += '   ';
    }
    out += i.toString(16).toUpperCase().padStart(4, '0') + '  ' + hex + ' ' + asc + '\n';
  }
  return out || '(no bytes)';
}

// What the data actually contains decides which parsed fields are shown.
let HAS = { moisture: false, temp: false, commodity: false, meter: false, code: false };
function detectFields() {
  const any = f => ROWS.some(f);
  HAS = {
    moisture: any(r => isNum(r.moisture_pct)),
    temp: any(r => isNum(r.temperature_c)),
    commodity: any(r => r.commodity && String(r.commodity).trim()),
    code: any(r => r.code),
    meter: any(r => r.meter_date || r.meter_time),
  };
}

function visible() {
  const now = Date.now();
  const spans = { '24h': 864e5, '7d': 6048e5, '30d': 2592e6 };
  return ROWS.filter(r => {
    if (filters.commodity !== 'all' && commodityOf(r) !== filters.commodity) return false;
    if (filters.range !== 'all') {
      const d = tsOf(r);
      if (!d || now - d.getTime() > spans[filters.range]) return false;
    }
    return true;
  });
}

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// --- render ----------------------------------------------------------------
function showWaiting(msg) {
  built = false;
  $('app').innerHTML = '<div class="empty"><p>Waiting for data from the device&hellip;</p>' +
    '<p class="small">This page checks again by itself ' + esc(INTERVALS.find(i => i[0] === refreshSec)[1]) +
    '.<br>(' + esc(msg) + ')</p></div>';
}

function paintMeta() {
  $('meta').textContent =
    (DB.device ? DB.device + ' · ' : '') +
    (DB.total_readings != null ? DB.total_readings + ' records received · ' : '') +
    (DEVICE ? 'live from the logger' : 'updated ' + (DB.generated ? fmtTime(new Date(DB.generated)) : 'unknown'));
}

function render() {
  paintMeta();
  if (!ROWS.length) {
    built = false;
    $('app').innerHTML = '<div class="empty"><p>No data received yet.</p>' +
      '<p class="small">' + (DEVICE ? 'Anything the logger receives appears here within seconds.'
        : 'The logger pushes once an hour, or when its local page\u2019s push button is pressed.') +
      '<br>New data appears here by itself.</p></div>';
    return;
  }
  if (!built) buildSkeleton();
  update();
}

// Built once; later updates only replace the parts whose data changed, so an
// open dropdown, a half-typed search or an expanded slip survive a refresh.
function buildSkeleton() {
  $('app').innerHTML =
    '<div class="tiles" id="tiles"></div>' +
    CHARTS.map(c =>
      '<div class="card" id="card-' + c.id + '" hidden>' +
        '<h2>' + c.title + '</h2>' +
        '<div class="cap">One dot per record that contained a ' + c.word + ' value. Hover for details, click a dot to open the record.</div>' +
        '<div id="legend-' + c.id + '"></div><div id="chart-' + c.id + '"></div>' +
      '</div>').join('') +
    '<div class="card">' +
      '<div class="cardhead"><h2>Received data</h2>' +
        '<input type="search" id="q" placeholder="Search the received text" aria-label="Search records"></div>' +
      '<div class="filters">' +
        '<span id="fcwrap" hidden><label for="fc">Commodity</label> <select id="fc"></select></span>' +
        '<button id="histbtn" hidden title="Load every record from the permanent archive">Load full history</button>' +
        '<label for="fr">Period</label><select id="fr">' +
        [['all', 'All time'], ['24h', 'Last 24 hours'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days']]
          .map(([v, l]) => '<option value="' + v + '">' + l + '</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="cap" id="tcap"></div>' +
      '<div style="overflow-x:auto"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>' +
    '</div>';
  built = true;

  $('fr').value = filters.range;
  $('q').value = query;
  $('fc').onchange = e => { filters.commodity = e.target.value; update(); };
  $('fr').onchange = e => { filters.range = e.target.value; update(); };
  $('q').oninput = e => { query = e.target.value; drawTable(visible()); };
  $('histbtn').onclick = () => {
    historyAll = true;
    $('histbtn').disabled = true;
    $('histbtn').textContent = 'Loading history\u2026';
    load();
  };
  $('thead').onclick = e => {
    const th = e.target.closest('th');
    if (!th) return;
    const k = th.dataset.k;
    sortBy = sortBy.key === k ? { key: k, dir: -sortBy.dir } : { key: k, dir: cols().find(c => c.key === k).num ? -1 : 1 };
    drawTable(visible());
  };
  $('tbody').onclick = e => {
    const tr = e.target.closest('tr.rec');
    if (!tr) return;
    const seq = +tr.dataset.seq, raw = $('raw-' + seq);
    if (openRaw.has(seq)) openRaw.delete(seq); else openRaw.add(seq);
    if (raw) raw.hidden = !openRaw.has(seq);
  };
}

function update() {
  detectFields();
  if (!cols().some(c => c.key === sortBy.key)) sortBy = { key: 'seq', dir: -1 };
  $('fcwrap').hidden = !HAS.commodity;
  $('histbtn').hidden = !ARCHIVE || historyAll || !(DB.total_readings > ROWS.length);
  if (!HAS.commodity) filters.commodity = 'all';
  syncCommodityOptions();
  const rows = visible();
  $('tiles').innerHTML = tilesHtml(rows);
  drawCharts(rows);
  drawTable(rows);
}

function syncCommodityOptions() {
  const names = [...new Set(ROWS.map(commodityOf))].sort();
  if (filters.commodity !== 'all' && !names.includes(filters.commodity)) filters.commodity = 'all';
  const html = '<option value="all">All</option>' + names.map(n => '<option>' + esc(n) + '</option>').join('');
  const fc = $('fc');
  if (fc.dataset.html !== html) { fc.innerHTML = html; fc.dataset.html = html; }
  fc.value = filters.commodity;
}

function tilesHtml(rows) {
  const last = rows[rows.length - 1];
  const lastNew = last && fresh.has(last.seq);
  const bytes = rows.reduce((a, r) => a + (isNum(r.bytes) ? +r.bytes : 0), 0);
  const t = (k, v, u, n, cls) =>
    '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="k">' + k + '</div><div class="v">' + v +
    (u ? '<span class="u">' + u + '</span>' : '') + '</div>' +
    (n ? '<div class="n">' + n + '</div>' : '') + '</div>';
  let html =
    t('Records', rows.length, '', ROWS.length !== rows.length ? 'of ' + ROWS.length + ' stored'
      : (ARCHIVE && !historyAll && DB.total_readings > ROWS.length ? 'newest shown - the rest are in the archive'
         : DEVICE ? 'waiting in the logger' : 'all received')) +
    t('Last received', last ? esc(fmtTime(tsOf(last))) : '--', '', last ? 'record ' + esc(last.seq) : '', lastNew ? 'new' : '') +
    t('Bytes received', bytes.toLocaleString(), '', rows.length ? 'about ' + Math.round(bytes / rows.length) + ' per record' : '');
  if (HAS.moisture) {
    const m = rows.map(r => r.moisture_pct).filter(isNum).map(Number);
    const lastM = [...rows].reverse().find(r => isNum(r.moisture_pct));
    const mean = m.length ? m.reduce((a, b) => a + b, 0) / m.length : null;
    html += t('Latest moisture', lastM ? num(lastM.moisture_pct) : '--', '%',
              lastM && HAS.commodity ? esc(commodityOf(lastM)) : '') +
      t('Mean moisture', mean == null ? '--' : num(mean, 2), '%', m.length + ' with a value') +
      t('Range', m.length ? num(Math.min(...m)) + '\u2013' + num(Math.max(...m)) : '--', m.length ? '%' : '', 'lowest to highest');
  }
  if (HAS.temp) {
    const lastT = [...rows].reverse().find(r => isNum(r.temperature_c));
    html += t('Latest temperature', lastT ? num(lastT.temperature_c) : '--', '\u00b0C', '');
  }
  return html;
}

function legendHtml(rows) {
  const present = new Set(rows.map(commodityOf));
  const names = [...COLORS.keys()].filter(n => present.has(n));
  if (names.length < 2) return '';
  return '<div class="legend">' + names.map(n =>
    '<span><i class="swatch" style="background:' + (COLORS.get(n) || OTHER) + '"></i>' + esc(n) + '</span>').join('') + '</div>';
}

// --- charts ----------------------------------------------------------------
// One card per measured value. A card shows once there are 2+ timestamped
// readings of that value.
const CHARTS = [
  { id: 'moisture', field: 'moisture_pct',  title: 'Moisture by reading time',    word: 'moisture',    unit: '%',      axis: 'moisture %',     pct: true },
  { id: 'temp',     field: 'temperature_c', title: 'Temperature by reading time', word: 'temperature', unit: '\u00b0C', axis: 'temperature \u00b0C', pct: false },
];

function drawCharts(rows) {
  CHARTS.forEach(c => {
    const card = $('card-' + c.id);
    if (!card) return;
    const plottable = rows.filter(r => tsOf(r) && isNum(r[c.field])).length;
    card.hidden = plottable < 2;
    if (card.hidden) return;
    $('legend-' + c.id).innerHTML = HAS.commodity && plottable >= 2 ? legendHtml(rows) : '';
    drawChart(c, rows);
  });
}

function drawChart(c, rows) {
  const host = $('chart-' + c.id);
  if (!host) return;
  const pts = rows.filter(r => tsOf(r) && isNum(r[c.field]));
  const skipped = rows.length - pts.length;

  if (pts.length < 2) {
    host.innerHTML = '<div class="empty">Not enough timestamped readings to plot yet.' +
      (skipped ? '<br>' + skipped + ' record(s) have no ' + c.word + ' value or no time — they are in the table below.' : '') + '</div>';
    return;
  }

  const W = Math.max(host.clientWidth || 640, 300), H = 280;
  const P = { t: 14, r: 14, b: 30, l: 42 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;

  const xs = pts.map(r => tsOf(r).getTime());
  const ys = pts.map(r => +r[c.field]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 36e5; x1 += 36e5; }

  // Round the y domain to a step that gives whole-number labels, so a
  // gridline's label is its actual value. Percentages never go below 0.
  const span = Math.max(Math.max(...ys) - Math.min(...ys), 1);
  const step = [0.5, 1, 2, 2.5, 5, 10, 20, 50].find(s => span / s <= 6) || 100;
  let yMin = Math.floor((Math.min(...ys) - step / 2) / step) * step;
  if (c.pct) yMin = Math.max(0, yMin);
  const yMax = Math.ceil((Math.max(...ys) + step / 2) / step) * step;
  const dp = step < 1 ? 1 : 0;

  const X = v => P.l + (v - x0) / (x1 - x0) * iw;
  const Y = v => P.t + ih - (v - yMin) / (yMax - yMin || 1) * ih;

  let g = '';
  for (let v = yMin; v <= yMax + 1e-9; v += step) {
    const y = Y(v);
    g += '<line class="gridline" x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '"/>';
    g += '<text class="tick" x="' + (P.l - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + v.toFixed(dp) + '</text>';
  }
  g += '<line class="axisline" x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + (P.t + ih) + '" y2="' + (P.t + ih) + '"/>';

  const xTicks = Math.min(W < 480 ? 3 : 5, pts.length);
  for (let i = 0; i < xTicks; i++) {
    const v = x0 + (x1 - x0) * i / (xTicks - 1 || 1), x = X(v);
    const d = new Date(v);
    const lbl = (x1 - x0) > 1728e5
      ? d.toLocaleDateString(undefined, { timeZone: TZ, day: '2-digit', month: 'short' })
      : d.toLocaleTimeString(undefined, { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
    g += '<text class="tick" x="' + x + '" y="' + (P.t + ih + 18) + '" text-anchor="' +
         (i === 0 ? 'start' : i === xTicks - 1 ? 'end' : 'middle') + '">' + lbl + '</text>';
  }
  g += '<text class="tick" x="' + P.l + '" y="' + (P.t - 2) + '" text-anchor="start">' + c.axis + '</text>';

  // One line per commodity, in time order, drawn under the dots.
  const lines = new Map();
  pts.map((r, i) => i).sort((a, b) => xs[a] - xs[b]).forEach(i => {
    const k = commodityOf(pts[i]);
    if (!lines.has(k)) lines.set(k, { color: colorOf(pts[i]), d: [] });
    lines.get(k).d.push(X(xs[i]).toFixed(1) + ',' + Y(ys[i]).toFixed(1));
  });
  lines.forEach(l => {
    if (l.d.length > 1) g += '<path class="series" d="M' + l.d.join('L') + '" stroke="' + l.color + '"/>';
  });

  pts.forEach((r, i) => {
    g += '<circle class="dot' + (fresh.has(r.seq) ? ' new' : '') + '" data-seq="' + r.seq + '" cx="' + X(xs[i]) +
         '" cy="' + Y(ys[i]) + '" r="5" fill="' + colorOf(r) + '"/>';
  });

  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
                   '" role="img" aria-label="' + c.title + '">' + g + '</svg>' +
                   (skipped ? '<div class="cap" style="margin:8px 0 0">' + skipped +
                              ' record(s) without a ' + c.word + ' value or time are only in the table.</div>' : '');

  // the other measured values of the same record, for the tooltip
  const others = r => CHARTS.filter(o => o !== c && isNum(r[o.field]))
    .map(o => num(r[o.field]) + (o.unit === '%' ? '% ' + o.word : o.unit)).join(' · ');

  const bySeq = new Map(pts.map(r => [r.seq, r]));
  const tip = $('tip');
  host.querySelectorAll('.dot').forEach(el => {
    const r = bySeq.get(+el.dataset.seq);
    el.addEventListener('mouseenter', () => {
      const o = others(r);
      tip.innerHTML = '<b>' + num(r[c.field]) + (c.unit === '%' ? '% ' + c.word : ' ' + c.unit) + '</b><br>' +
        esc(commodityOf(r)) + (r.code ? ' <span class="m">(' + esc(r.code) + ')</span>' : '') + '<br>' +
        '<span class="m">' + fmtTime(tsOf(r)) + (o ? ' · ' + o : '') +
        '<br>seq ' + esc(r.seq) + ' · click to open slip</span>';
      tip.style.opacity = 1;
      el.setAttribute('r', 7);
    });
    el.addEventListener('mousemove', ev => {
      tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 10) + 'px';
      tip.style.top = Math.max(ev.clientY - tip.offsetHeight - 12, 8) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.opacity = 0; el.setAttribute('r', 5); });
    el.addEventListener('click', () => { tip.style.opacity = 0; focusRow(r.seq); });
  });
}

// --- table -----------------------------------------------------------------
const ALL_COLS = [
  { key: 'seq',       label: 'Seq',         num: true, val: r => isNum(r.seq) ? +r.seq : null,
    td: r => '<td class="num">' + esc(r.seq) + '</td>' },
  { key: 'time',      label: 'Received',               val: r => { const d = tsOf(r); return d ? d.getTime() : null; },
    td: r => '<td style="white-space:nowrap">' + fmtTime(tsOf(r)) + '</td>' },
  { key: 'data',      label: 'Data',                   val: r => rawBytes(r),
    td: r => '<td class="data">' + previewHtml(r) + '</td>' },
  { key: 'bytes',     label: 'Bytes',       num: true, val: r => isNum(r.bytes) ? +r.bytes : null,
    td: r => '<td class="num">' + esc(r.bytes || '') + '</td>' },
  { key: 'commodity', label: 'Commodity',  has: 'commodity', val: r => commodityOf(r).toLowerCase(),
    td: r => '<td><span class="chip"><i class="swatch" style="background:' + colorOf(r) + '"></i>' + esc(commodityOf(r)) + '</span></td>' },
  { key: 'code',      label: 'Code',       has: 'code', val: r => r.code ? String(r.code) : null,
    td: r => '<td>' + esc(r.code || '') + '</td>' },
  { key: 'moisture',  label: 'Moisture %', has: 'moisture', num: true, val: r => isNum(r.moisture_pct) ? +r.moisture_pct : null,
    td: r => '<td class="num">' + num(r.moisture_pct) + '</td>' },
  { key: 'temp',      label: 'Temp \u00b0C', has: 'temp', num: true, val: r => isNum(r.temperature_c) ? +r.temperature_c : null,
    td: r => '<td class="num">' + num(r.temperature_c) + '</td>' },
  { key: 'meter',     label: 'Meter clock', has: 'meter', val: r => [r.meter_date, r.meter_time].filter(Boolean).join(' ') || null,
    td: r => '<td>' + esc([r.meter_date, r.meter_time].filter(Boolean).join(' ') || '\u2014') + '</td>' },
];
const cols = () => ALL_COLS.filter(c => !c.has || HAS[c.has]);

function tableRows(rows) {
  const q = query.trim().toLowerCase();
  const out = q ? rows.filter(r =>
    [r.seq, cleanText(r), rawBytes(r), r.commodity, r.code, num(r.moisture_pct), num(r.temperature_c), r.meter_date, r.meter_time, fmtTime(tsOf(r))]
      .join(' ').toLowerCase().includes(q)) : rows.slice();
  const col = cols().find(c => c.key === sortBy.key) || ALL_COLS[0];
  out.sort((a, b) => {
    const x = col.val(a), y = col.val(b);
    if (x == null || y == null) return (x == null) - (y == null) || (b.seq - a.seq);   // blanks last
    return (x < y ? -1 : x > y ? 1 : 0) * sortBy.dir || (b.seq - a.seq);
  });
  return out;
}

function drawTable(rows) {
  const list = tableRows(rows);
  const cs = cols();
  $('thead').innerHTML = '<tr>' + cs.map(c =>
    '<th data-k="' + c.key + '"' + (c.num ? ' class="r"' : '') +
    ' aria-sort="' + (sortBy.key === c.key ? (sortBy.dir > 0 ? 'ascending' : 'descending') : 'none') + '">' +
    c.label + '<span class="arr">' + (sortBy.key === c.key ? (sortBy.dir > 0 ? '▴' : '▾') : '') + '</span></th>').join('') + '</tr>';

  let body = '';
  for (const r of list) {
    body += '<tr class="rec' + (fresh.has(r.seq) ? ' new' : '') + '" data-seq="' + esc(r.seq) + '">' +
      cs.map(c => c.td(r)).join('') + '</tr>' +
      '<tr class="raw" id="raw-' + esc(r.seq) + '"' + (openRaw.has(r.seq) ? '' : ' hidden') +
      '><td colspan="' + cs.length + '">' + detailHtml(r) + '</td></tr>';
  }
  if (!list.length) body = '<tr><td colspan="' + cs.length + '" class="empty" style="padding:24px">No records match.</td></tr>';
  $('tbody').innerHTML = body;
  $('tcap').textContent = (list.length === rows.length ? list.length + ' records' : list.length + ' of ' + rows.length + ' records') +
    (DEVICE ? ' waiting in the logger (pushed records are deleted from it - see the public site)' : '') +
    '. Printer commands are removed from the data; click a row for the data and the exact bytes received (hex). Click a column heading to sort.';
}

function focusRow(seq) {
  if (!$('raw-' + seq)) { query = ''; $('q').value = ''; drawTable(visible()); }
  openRaw.add(seq);
  const raw = $('raw-' + seq), tr = document.querySelector('tr.rec[data-seq="' + seq + '"]');
  if (!tr) return;
  raw.hidden = false;
  tr.classList.remove('hl'); void tr.offsetWidth; tr.classList.add('hl');
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// --- device panel (only when served by the logger) -------------------------
let DEVICE = null, pushing = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function dur(s) {
  if (s < 60) return s + ' s';
  if (s < 3600) return Math.round(s / 60) + ' min';
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}

async function devStatus() {
  let s;
  try {
    const r = await fetch('./api/status?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    s = await r.json();
    if (!s || !s.device) return null;
  } catch { if (DEVICE) paintDevice(null); return null; }
  const first = !DEVICE;
  DEVICE = s;
  paintDevice(s);
  if (first && DB) paintMeta();
  return s;
}

function paintDevice(s) {
  $('dev').hidden = false;
  const btn = $('pushbtn');
  if (!s) {
    $('devline1').innerHTML = '<span class="warn">The logger is not answering.</span>';
    $('devline2').textContent = 'Check that it is powered and on this network.';
    btn.disabled = true;
    return;
  }
  const wifi = s.wifi ? esc(s.ip) + ' \u00b7 WiFi ' + esc(s.ssid) + ' (' + s.rssi + ' dBm)'
                      : '<span class="warn">WiFi disconnected</span>';
  const ln = s.line || {};
  const lineTxt = ln.known
    ? 'line ' + ln.baud + ' ' + esc(ln.format) + (ln.invert ? ' inverted' : '') + (ln.auto ? ' (auto-detected)' : ' (set by hand)') +
      (ln.gap_ms ? ', a record ends after ' + (ln.gap_ms >= 1000 ? (ln.gap_ms / 1000) + ' s' : ln.gap_ms + ' ms') + ' of silence' : '')
    : '<span class="warn">learning the line settings: print a slip on the meter</span>' +
      (ln.edges ? ' (' + ln.edges + ' edges seen)' : '');
  $('devline1').innerHTML = wifi + ' \u00b7 ' + s.records + ' records in flash \u00b7 ' + lineTxt;

  let push;
  if (s.unpushed > 0) {
    push = '<b>' + s.unpushed + (s.unpushed === 1 ? ' new record' : ' new records') + ' not on GitHub yet</b>';
    if (s.next_push_s != null) push += ' \u00b7 automatic push ' + (s.next_push_s > 0 ? 'in ' + dur(s.next_push_s) : 'now');
  } else {
    push = 'GitHub has every record';
  }
  const lp = s.last_push || {};
  if (lp.at && !lp.ok) push += ' \u00b7 <span class="warn">last push failed: ' + esc(lp.result) + '</span>';
  else if (s.last_ok_at) push += ' \u00b7 last push ' + fmtTime(new Date(s.last_ok_at));
  if (s.site) push += ' \u00b7 <a href="' + esc(s.site) + '" target="_blank" rel="noopener">public site</a>';
  $('devline2').innerHTML = push;

  if (!pushing) {
    btn.disabled = !(s.unpushed > 0 && s.wifi);
    btn.textContent = s.unpushed > 0 ? 'Push to GitHub now' : 'Nothing new to push';
  }
}

async function pushNow() {
  const btn = $('pushbtn');
  pushing = true;
  btn.disabled = true;
  btn.textContent = 'Pushing\u2026';
  try {
    const r = await fetch('./api/push', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.message || 'Push refused (HTTP ' + r.status + ')'); pushing = false; devStatus(); return; }
  } catch { toast('The logger is not answering.'); pushing = false; devStatus(); return; }

  // The logger answers status requests once the push has finished.
  const t0 = Date.now();
  for (;;) {
    await sleep(2000);
    const s = await devStatus();
    if (s && !s.push_requested && s.last_push && s.last_push.at) {
      toast(s.last_push.ok ? 'Pushed to GitHub. The public site shows it in about a minute.'
                           : 'Push failed: ' + s.last_push.result);
      break;
    }
    if (Date.now() - t0 > 120000) { toast('The push is taking unusually long.'); break; }
  }
  pushing = false;
  devStatus();
}

// --- controls --------------------------------------------------------------
$('every').innerHTML = INTERVALS.map(([s, l]) => '<option value="' + s + '">' + l + '</option>').join('');
$('every').value = refreshSec;
$('every').onchange = e => { refreshSec = +e.target.value; pref.set('refreshSec', refreshSec); schedule(); };
$('live').onclick = () => {
  live = !live;
  pref.set('live', live ? '1' : '0');
  if (live) load(); else { clearTimeout(timer); paintPill(); }
};
$('now').onclick = () => { load(); if (DEVICE) devStatus(); };
$('pushbtn').onclick = pushNow;
$('redetect').onclick = async () => {
  if (!confirm('Forget the line settings and learn them again from the next slip printed on the meter?')) return;
  try {
    const r = await fetch('./api/redetect', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    toast(j.message || (r.ok ? 'Re-detecting.' : 'Refused (HTTP ' + r.status + ')'));
  } catch { toast('The logger is not answering.'); }
  devStatus();
};
$('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};
$('csv').onclick = () => {
  if (!DB) return;
  const keys = ['seq', 'device_ts', 'bytes', 'text', 'meter_date', 'meter_time', 'commodity', 'code',
                'moisture_pct', 'temperature_c', 'humidity_pct', 'crc32', 'raw_b64'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [keys.join(',')].concat(visible().map(r =>
    keys.map(k => q(k === 'text' ? cleanText(r) : r[k])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = (DB.device || 'meter-data') + '.csv';
  a.click();
};

// pause while the tab is hidden, catch up the moment it is shown again
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTimeout(timer);
  else if (live) { load(); if (DEVICE) devStatus(); }
});
// device status every 10 s while visible (the page is on the local network)
setInterval(() => { if (DEVICE && !document.hidden && !pushing) devStatus(); }, 10000);
let resizeTimer = null;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (built) drawCharts(visible()); }, 150);
});
setInterval(paintPill, 1000);

devStatus();   // a 404 on GitHub Pages: the page stays a plain viewer
load();
</script>
</body>
</html>
